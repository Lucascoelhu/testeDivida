<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEGA ADM ELITE</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #0f172a; --a: #fbbf24; --r: #f43f5e; --g: #10b981; 
            --b: #3b82f6; --bg: #f8fafc; --card: #ffffff; 
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; background: var(--bg); color: var(--p); padding-bottom: 40px; overflow-x: hidden; }

        /* Animações */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }

        .animate-up { animation: slideUp 0.5s ease-out forwards; }
        .animate-fade { animation: fadeIn 0.4s ease-in; }

        /* Navbar Lojas */
        .stores { display: flex; background: var(--p); padding: 10px; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .s-btn { flex: 1; border: none; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 0.75rem; cursor: pointer; background: #1e293b; color: #64748b; transition: 0.3s; }
        .s-btn.active { background: var(--a); color: var(--p); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3); }

        /* Lista de Funcionários */
        .drawer { background: #1e293b; padding: 20px; border-bottom: 4px solid var(--a); }
        .f-list { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; scroll-behavior: smooth; }
        .f-list::-webkit-scrollbar { display: none; }
        .f-chip { background: #334155; color: #f8fafc; padding: 12px 20px; border-radius: 50px; white-space: nowrap; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .f-chip.active { background: #fff; color: var(--p); border-color: var(--a); transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .container { max-width: 500px; margin: auto; padding: 20px; }
        
        /* Cards Interativos */
        .card { 
            background: var(--card); border-radius: 28px; padding: 24px; margin-bottom: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #f1f5f9;
            transition: 0.3s;
        }
        .card:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.06); }

        input, select { 
            width: 100%; padding: 16px; margin: 8px 0; border: 2px solid #f1f5f9; border-radius: 18px; 
            font-size: 1rem; background: #f8fafc; transition: 0.3s; outline: none;
        }
        input:focus { border-color: var(--a); background: #fff; box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1); }

        .btn { 
            border: none; border-radius: 18px; font-weight: 700; cursor: pointer; padding: 18px; 
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; 
        }
        .btn:active { animation: pulse 0.2s linear; }
        
        .b-dark { background: var(--p); color: var(--a); }
        .b-vale { background: var(--b); color: #fff; flex: 1; }
        .b-buy { background: var(--p); color: #fff; flex: 1; }
        .b-pay { background: var(--g); color: #fff; width: 100%; margin-top: 10px; }

        .total-info { text-align: center; padding: 30px 0; }
        .big-val { font-size: 3.2rem; font-weight: 800; letter-spacing: -3px; color: var(--p); }
        
        /* Histórico Estilizado */
        .row { display: flex; justify-content: space-between; padding: 16px; border-radius: 16px; margin-bottom: 8px; background: #fff; border: 1px solid #f1f5f9; align-items: center; transition: 0.2s; }
        .row:hover { background: #f8fafc; }
        .badge { font-size: 0.65rem; font-weight: 800; padding: 5px 10px; border-radius: 8px; background: #e2e8f0; color: #475569; }
        
        .btn-del { 
            background: #fee2e2; color: var(--r); border: none; width: 32px; height: 32px; 
            border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .btn-del:hover { background: var(--r); color: #fff; }

        /* Toast de Cópia */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--p); color: #fff; padding: 12px 25px; border-radius: 50px; font-weight: 600; font-size: 0.8rem; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="toast">Link copiado com sucesso! 🚀</div>

<div class="stores">
    <button id="m1" class="s-btn active" onclick="setLoja('Mega Mix', 'm1')">MEGA MIX</button>
    <button id="m2" class="s-btn" onclick="setLoja('Mega Show', 'm2')">MEGA SHOW</button>
</div>

<div class="drawer">
    <div style="display:flex; gap:12px; margin-bottom:12px">
        <input type="text" id="nF" placeholder="Nome do novo funcionário..." style="margin:0; padding:14px">
        <button class="btn b-dark" onclick="addF()" style="width:60px; padding:0; border-radius: 15px">＋</button>
    </div>
    <div id="fList" class="f-list"></div>
</div>

<div class="container animate-up" id="main" style="display:none">
    <div class="total-info">
        <div id="curName" style="font-weight:700; color:#94a3b8; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem"></div>
        <div class="big-val" id="tG">R$ 0,00</div>
        <button onclick="copyL()" style="background:rgba(59, 130, 246, 0.1); border:none; color:var(--b); font-weight:700; font-size:0.75rem; padding: 8px 16px; border-radius: 50px; cursor:pointer; margin-top:10px">🔗 COMPARTILHAR EXTRATO</button>
    </div>

    <div class="card">
        <h3 style="margin:0 0 15px 0; font-size:0.9rem; color: #64748b">NOVO LANÇAMENTO</h3>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="dia" placeholder="Dia">
            <select id="mesRef">
                <option value="01">Janeiro</option><option value="02">Fevereiro</option>
                <option value="03">Março</option><option value="04">Abril</option>
                <option value="05">Maio</option><option value="06">Junho</option>
                <option value="07">Julho</option><option value="08">Agosto</option>
                <option value="09">Setembro</option><option value="10">Outubro</option>
                <option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
        </div>
        <input type="text" id="mot" placeholder="Descrição (ex: Tênis Nike, Vale)">
        <input type="number" id="val" placeholder="Valor R$">
        <div style="display:flex; gap:12px; margin-top:10px">
            <button class="btn b-buy" onclick="save('COMPRA')">🛒 COMPRA</button>
            <button class="btn b-vale" onclick="save('VALE')">💵 VALE</button>
        </div>
    </div>

    <div class="card" style="border-left: 6px solid var(--g)">
        <h3 style="margin:0 0 10px 0; font-size:0.9rem; color: #64748b">BAIXAR DÍVIDA</h3>
        <input type="number" id="vP" placeholder="Valor que o funcionário pagou">
        <button class="btn b-pay" onclick="pay()">REGISTRAR PAGAMENTO ✅</button>
    </div>

    <div id="hist-area" class="animate-fade">
        <h3 style="margin:10px 10px; font-size:0.9rem; color: #64748b">HISTÓRICO RECENTE</h3>
        <div id="tab"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDo_13oIV7Jy5pmsbKBNxtGBIjb_H2Yo-s",
        authDomain: "teste-divida.firebaseapp.com",
        databaseURL: "https://teste-divida-default-rtdb.firebaseio.com",
        projectId: "teste-divida",
        storageBucket: "teste-divida.firebasestorage.app",
        messagingSenderId: "72737446721",
        appId: "1:72737446721:web:9f179ee0812dc110bf5fc0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let loja = "Mega Mix", idA = null, nomeA = "";

    function showToast() {
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    }

    function ajustarDataHoje() {
        const hoje = new Date();
        document.getElementById('dia').value = String(hoje.getDate()).padStart(2, '0');
        document.getElementById('mesRef').value = String(hoje.getMonth() + 1).padStart(2, '0');
    }

    function setLoja(l, b) {
        loja = l; idA = null;
        document.querySelectorAll('.s-btn').forEach(x => x.classList.remove('active'));
        document.getElementById(b).classList.add('active');
        document.getElementById('main').style.display = 'none';
        loadF();
    }

    function addF() {
        const n = document.getElementById('nF').value;
        if(n) db.ref(`lojas/${loja}/funcionarios`).push({ nome: n });
        document.getElementById('nF').value = "";
    }

    function loadF() {
        db.ref(`lojas/${loja}/funcionarios`).on('value', s => {
            const list = document.getElementById('fList');
            list.innerHTML = "";
            s.forEach(f => {
                const active = idA === f.key ? 'active' : '';
                list.innerHTML += `<div class="f-chip ${active}" onclick="sel('${f.key}', '${f.val().nome}')">${f.val().nome}</div>`;
            });
        });
    }

    function sel(id, n) {
        idA = id; nomeA = n;
        const main = document.getElementById('main');
        main.style.display = 'block';
        main.classList.remove('animate-up');
        void main.offsetWidth; // Trigger reflow
        main.classList.add('animate-up');
        
        document.getElementById('curName').innerText = n;
        ajustarDataHoje();
        db.ref(`lojas/${loja}/funcionarios/${id}/dividas`).on('value', s => render(s.val()));
        loadF();
    }

    function render(d) {
        const tab = document.getElementById('tab');
        let t = 0; tab.innerHTML = "";
        if(d) {
            Object.keys(d).reverse().forEach(key => {
                const x = d[key];
                t += x.valor;
                tab.innerHTML += `
                <div class="row animate-fade">
                    <div style="flex:1">
                        <span class="badge">${x.data}</span>
                        <div style="font-weight:700; font-size:0.85rem; margin-top:4px; color:var(--p)">${x.motivo}</div>
                    </div>
                    <div style="font-weight:800; color:${x.valor<0?'var(--g)':'var(--r)'}; margin-right:12px; font-size:0.9rem">
                        ${x.valor < 0 ? '-' : ''} R$ ${Math.abs(x.valor).toFixed(2)}
                    </div>
                    <button class="btn-del" onclick="deletarItem('${key}')">×</button>
                </div>`;
            });
        }
        document.getElementById('tG').innerText = t.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
        window.total = t;
    }

    function deletarItem(key) {
        if(confirm("Deseja apagar este registro permanentemente?")) {
            db.ref(`lojas/${loja}/funcionarios/${idA}/dividas/${key}`).remove();
        }
    }

    function save(tipo) {
        const m = document.getElementById('mot').value, d = document.getElementById('dia').value, v = parseFloat(document.getElementById('val').value), mesSel = document.getElementById('mesRef').value;
        if(m && d && v) {
            db.ref(`lojas/${loja}/funcionarios/${idA}/dividas`).push({motivo:m, data:d.padStart(2,'0')+'/'+mesSel, valor:v, tipo:tipo});
            document.getElementById('mot').value = ""; document.getElementById('val').value = "";
        }
    }

    function pay() {
        const v = parseFloat(document.getElementById('vP').value);
        if(!v) return;
        const dataH = new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
        db.ref(`lojas/${loja}/funcionarios/${idA}/dividas`).push({motivo:'PAGAMENTO RECEBIDO', data:dataH, valor:-v, tipo:'PGTO'});
        document.getElementById('vP').value = "";
    }

    function copyL() {
        const link = `${window.location.origin}${window.location.pathname.replace('admin.html','extrato.html')}?loja=${loja}&id=${idA}`;
        navigator.clipboard.writeText(`Olá ${nomeA}! Aqui está seu extrato atualizado da ${loja}:\n\n🔗 ${link}`);
        showToast();
    }
    loadF();
</script>
</body>
</html>
