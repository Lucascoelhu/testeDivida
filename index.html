<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Dívidas</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1a1d23; --yellow: #ffcc00; --red: #ff6b6b; --green: #51cf66; }
        body { font-family: 'Roboto', sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f4f4; }
        
        /* Sidebar Menu */
        .sidebar { width: 280px; background: var(--dark); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: #111; text-align: center; color: var(--yellow); font-weight: bold; }
        .func-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .func-item { padding: 15px 20px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .func-item:hover { background: #333; }
        .func-item.active { border-left: 5px solid var(--yellow); background: #333; }
        .btn-del { color: var(--red); cursor: pointer; font-weight: bold; padding: 5px; }

        /* Main Content */
        .main { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Formulários */
        .input-group { margin-bottom: 15px; display: flex; gap: 10px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; flex-grow: 1; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-add { background: var(--dark); color: var(--yellow); }
        .btn-pay { background: var(--green); color: white; }

        /* Tabela Estilo seu Design */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--dark); color: white; padding: 12px; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        .col-data-dez { background: #f8d7da; font-weight: bold; }
        .col-data-jan { background: #d4edda; font-weight: bold; }
        
        .total-display { font-size: 1.5rem; color: #a02020; font-weight: bold; text-align: right; margin-top: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">FUNCIONÁRIOS</div>
    <div style="padding: 10px;">
        <input type="text" id="novoNome" placeholder="Nome do Func..." style="width: 70%;">
        <button class="btn-add" onclick="addFuncionario()">+</button>
    </div>
    <ul class="func-list" id="listaFunc"></ul>
</div>

<div class="main">
    <div id="painelVazio">
        <h2>Selecione um funcionário no menu ao lado.</h2>
    </div>

    <div id="painelDividas" style="display:none;">
        <div class="header-main">
            <h1 id="nomeSelecionado" style="text-transform: uppercase;"></h1>
            <div class="total-display" id="totalGeral">R$ 0,00</div>
        </div>

        <div class="card">
            <h3>Nova Dívida</h3>
            <div class="input-group">
                <input type="text" id="motivo" placeholder="Motivo (Ex: Compras)">
                <input type="text" id="data" placeholder="Data (DD/MM)">
                <input type="number" id="valor" placeholder="Valor (Ex: 50.00)">
                <button class="btn-add" onclick="lancarDivida()">Lançar</button>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Realizar Pagamento</h3>
            <div class="input-group">
                <input type="number" id="valorPago" placeholder="Quanto ele está pagando?">
                <button class="btn-pay" onclick="abaterDivida()">Confirmar Pagamento</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Motivo</th>
                    <th>Data</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO FIREBASE ---
    const firebaseConfig = {
  apiKey: "AIzaSyDo_13oIV7Jy5pmsbKBNxtGBIjb_H2Yo-s",
  authDomain: "teste-divida.firebaseapp.com",
  databaseURL: "https://teste-divida-default-rtdb.firebaseio.com",
  projectId: "teste-divida",
  storageBucket: "teste-divida.firebasestorage.app",
  messagingSenderId: "72737446721",
  appId: "1:72737446721:web:9f179ee0812dc110bf5fc0"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let idAtivo = null;

    // --- FUNÇÕES DE FUNCIONÁRIOS ---
    function addFuncionario() {
        const nome = document.getElementById('novoNome').value;
        if (!nome) return;
        const novoRef = db.ref('loja/funcionarios').push();
        novoRef.set({ nome: nome, dividas: [] });
        document.getElementById('novoNome').value = "";
    }

    function removerFunc(id, e) {
        e.stopPropagation();
        if (confirm("Deseja remover este funcionário e todas as dívidas?")) {
            db.ref('loja/funcionarios/' + id).remove();
            if (idAtivo === id) location.reload();
        }
    }

    // --- ESCUTAR LISTA DE FUNCIONÁRIOS ---
    db.ref('loja/funcionarios').on('value', snap => {
        const lista = document.getElementById('listaFunc');
        lista.innerHTML = "";
        snap.forEach(child => {
            const f = child.val();
            lista.innerHTML += `
                <li class="func-item ${idAtivo === child.key ? 'active' : ''}" onclick="abrirFuncionario('${child.key}', '${f.nome}')">
                    ${f.nome}
                    <span class="btn-del" onclick="removerFunc('${child.key}', event)">✕</span>
                </li>`;
        });
    });

    // --- GERENCIAR DÍVIDAS ---
    function abrirFuncionario(id, nome) {
        idAtivo = id;
        document.getElementById('painelVazio').style.display = 'none';
        document.getElementById('painelDividas').style.display = 'block';
        document.getElementById('nomeSelecionado').innerText = nome;
        
        db.ref('loja/funcionarios/' + id + '/dividas').on('value', snap => {
            renderizarDividas(snap.val());
        });
    }

    function lancarDivida() {
        const mot = document.getElementById('motivo').value;
        const dat = document.getElementById('data').value;
        const val = parseFloat(document.getElementById('valor').value);
        if (!mot || !dat || !val) return;

        db.ref('loja/funcionarios/' + idAtivo + '/dividas').push({
            motivo: mot, data: dat, valor: val
        });
        
        document.getElementById('motivo').value = "";
        document.getElementById('valor').value = "";
    }

    function renderizarDividas(dividas) {
        const corpo = document.getElementById('corpoTabela');
        const totalTxt = document.getElementById('totalGeral');
        corpo.innerHTML = "";
        let total = 0;

        if (dividas) {
            Object.keys(dividas).forEach(key => {
                const item = dividas[key];
                total += item.valor;
                const classeCor = item.data.includes('/12') ? 'col-data-dez' : 'col-data-jan';
                corpo.innerHTML += `
                    <tr>
                        <td style="font-style:italic">${item.motivo}</td>
                        <td class="${classeCor}">${item.data}</td>
                        <td style="color:red; font-weight:bold">R$ ${item.valor.toFixed(2)}</td>
                    </tr>`;
            });
        }
        totalTxt.innerText = "R$ " + total.toFixed(2).replace('.', ',');
        window.totalAtual = total;
    }

    function abaterDivida() {
        const valorPago = parseFloat(document.getElementById('valorPago').value);
        if (!valorPago || !idAtivo) return;

        if (valorPago >= window.totalAtual) {
            // Se pagou tudo ou mais, limpa o nó de dívidas
            db.ref('loja/funcionarios/' + idAtivo + '/dividas').remove();
            alert("Dívida totalmente quitada!");
        } else {
            // Se pagou parte, adicionamos um lançamento negativo para abater
            db.ref('loja/funcionarios/' + idAtivo + '/dividas').push({
                motivo: "PAGAMENTO PARCIAL",
                data: new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}),
                valor: -valorPago
            });
            alert("Valor abatido com sucesso!");
        }
        document.getElementById('valorPago').value = "";
    }
</script>
</body>
</html>
