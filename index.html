<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEGA ADM ELITE</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0f172a; --a: #fbbf24; --r: #f43f5e; --g: #10b981; --b: #3b82f6; --bg: #f8fafc; --card: #ffffff; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--p); padding-bottom: 40px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: slideUp 0.4s ease-out; }

        /* Navbar Lojas */
        .stores { display: flex; background: var(--p); padding: 10px; gap: 10px; position: sticky; top: 0; z-index: 100; }
        .s-btn { flex: 1; border: none; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 0.75rem; cursor: pointer; background: #1e293b; color: #64748b; transition: 0.3s; }
        .s-btn.active { background: var(--a); color: var(--p); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3); }

        /* Lista de Funcionários */
        .drawer { background: #1e293b; padding: 15px; border-bottom: 4px solid var(--a); }
        .f-list { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
        .f-chip { background: #334155; color: #f8fafc; padding: 10px 18px; border-radius: 50px; white-space: nowrap; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .f-chip.active { background: #fff; color: var(--p); border-color: var(--a); transform: scale(1.05); }

        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: var(--card); border-radius: 28px; padding: 22px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
        
        input, select { width: 100%; padding: 14px; margin: 6px 0; border: 2px solid #f1f5f9; border-radius: 16px; font-size: 1rem; background: #f8fafc; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--a); background: #fff; }

        /* Atalhos Rápidos */
        .shortcuts-label { font-size: 0.7rem; font-weight: 800; color: #94a3b8; margin: 10px 0 5px 5px; display: block; }
        .shortcuts-container { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; margin-bottom: 5px; scrollbar-width: none; }
        .tag-btn { background: #f1f5f9; color: #475569; border: none; padding: 8px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tag-btn:hover { background: #e2e8f0; }
        .tag-add { background: var(--p); color: var(--a); font-size: 1rem; padding: 6px 15px; }

        .btn { border: none; border-radius: 18px; font-weight: 700; cursor: pointer; padding: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: 0.2s; }
        .b-vale { background: var(--b); color: #fff; flex: 1; }
        .b-buy { background: var(--p); color: #fff; flex: 1; }
        .b-pay { background: var(--g); color: #fff; margin-top: 10px; }

        .total-info { text-align: center; padding: 20px 0; }
        .big-val { font-size: 3rem; font-weight: 800; letter-spacing: -2px; }
        
        .row { display: flex; justify-content: space-between; padding: 14px; border-radius: 16px; margin-bottom: 8px; background: #fff; border: 1px solid #f1f5f9; align-items: center; }
        .btn-del { background: #fee2e2; color: var(--r); border: none; width: 30px; height: 30px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--p); color: #fff; padding: 12px 25px; border-radius: 50px; font-size: 0.8rem; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="toast">Link copiado! 🚀</div>

<div class="stores">
    <button id="m1" class="s-btn active" onclick="setLoja('Mega Mix', 'm1')">MEGA MIX</button>
    <button id="m2" class="s-btn" onclick="setLoja('Mega Show', 'm2')">MEGA SHOW</button>
</div>

<div class="drawer">
    <div style="display:flex; gap:10px; margin-bottom:10px">
        <input type="text" id="nF" placeholder="Novo funcionário..." style="margin:0; padding:12px">
        <button class="btn" style="width:50px; background:var(--p); color:var(--a)" onclick="addF()">＋</button>
    </div>
    <div id="fList" class="f-list"></div>
</div>

<div class="container animate-up" id="main" style="display:none">
    <div class="total-info">
        <div id="curName" style="font-weight:700; color:#94a3b8; font-size:0.8rem; text-transform:uppercase"></div>
        <div class="big-val" id="tG">R$ 0,00</div>
        <button onclick="copyL()" style="background:rgba(59,130,246,0.1); border:none; color:var(--b); font-weight:700; font-size:0.7rem; padding:8px 15px; border-radius:50px; cursor:pointer">🔗 COMPARTILHAR EXTRATO</button>
    </div>

    <div class="card">
        <h3 style="margin:0 0 10px 0; font-size:0.85rem; color:#64748b">LANÇAMENTO</h3>
        
        <div style="display: flex; gap: 8px;">
            <input type="number" id="dia" placeholder="Dia" style="flex:1">
            <select id="mesRef" style="flex:2">
                <option value="01">Janeiro</option><option value="02">Fevereiro</option>
                <option value="03">Março</option><option value="04">Abril</option>
                <option value="05">Maio</option><option value="06">Junho</option>
                <option value="07">Julho</option><option value="08">Agosto</option>
                <option value="09">Setembro</option><option value="10">Outubro</option>
                <option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
        </div>

        <span class="shortcuts-label">ATALHOS RÁPIDOS</span>
        <div class="shortcuts-container" id="shortcutBox">
            <button class="tag-btn tag-add" onclick="addShortcut()">＋</button>
        </div>

        <input type="text" id="mot" placeholder="O que ele comprou?">
        <input type="number" id="val" placeholder="Valor R$">
        
        <div style="display:flex; gap:10px; margin-top:10px">
            <button class="btn b-buy" onclick="save('COMPRA')">🛒 COMPRA</button>
            <button class="btn b-vale" onclick="save('VALE')">💵 VALE</button>
        </div>
    </div>

    <div class="card" style="border-left: 5px solid var(--g)">
        <h3 style="margin:0 0 10px 0; font-size:0.85rem; color:#64748b">PAGAMENTO</h3>
        <input type="number" id="vP" placeholder="Valor recebido">
        <button class="btn b-pay" onclick="pay()">REGISTRAR PAGAMENTO ✅</button>
    </div>

    <div id="tab"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDo_13oIV7Jy5pmsbKBNxtGBIjb_H2Yo-s",
        authDomain: "teste-divida.firebaseapp.com",
        databaseURL: "https://teste-divida-default-rtdb.firebaseio.com",
        projectId: "teste-divida",
        storageBucket: "teste-divida.firebasestorage.app",
        messagingSenderId: "72737446721",
        appId: "1:72737446721:web:9f179ee0812dc110bf5fc0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let loja = "Mega Mix", idA = null, nomeA = "";
    let shortcuts = JSON.parse(localStorage.getItem('myShortcuts')) || ["Compras", "Suco", "Doce", "Refri", "Cerveja"];

    function loadShortcuts() {
        const box = document.getElementById('shortcutBox');
        box.innerHTML = shortcuts.map(s => `<button class="tag-btn" onclick="setDesc('${s}')">${s}</button>`).join('') + 
                       `<button class="tag-btn tag-add" onclick="addShortcut()">＋</button>`;
    }

    function setDesc(txt) { document.getElementById('mot').value = txt; }

    function addShortcut() {
        const novo = prompt("Nome do novo atalho:");
        if(novo) {
            shortcuts.push(novo);
            localStorage.setItem('myShortcuts', JSON.stringify(shortcuts));
            loadShortcuts();
        }
    }

    function ajustarDataHoje() {
        const h = new Date();
        document.getElementById('dia').value = String(h.getDate()).padStart(2,'0');
        document.getElementById('mesRef').value = String(h.getMonth()+1).padStart(2,'0');
    }

    function setLoja(l, b) {
        loja = l; idA = null;
        document.querySelectorAll('.s-btn').forEach(x => x.classList.remove('active'));
        document.getElementById(b).classList.add('active');
        document.getElementById('main').style.display = 'none';
        loadF();
    }

    function loadF() {
        db.ref(`lojas/${loja}/funcionarios`).on('value', s => {
            const list = document.getElementById('fList');
            list.innerHTML = "";
            s.forEach(f => {
                const active = idA === f.key ? 'active' : '';
                list.innerHTML += `<div class="f-chip ${active}" onclick="sel('${f.key}', '${f.val().nome}')">${f.val().nome}</div>`;
            });
        });
    }

    function sel(id, n) {
        idA = id; nomeA = n;
        document.getElementById('main').style.display = 'block';
        document.getElementById('curName').innerText = n;
        ajustarDataHoje();
        db.ref(`lojas/${loja}/funcionarios/${id}/dividas`).on('value', s => render(s.val()));
        loadF();
    }

    function render(d) {
        const tab = document.getElementById('tab');
        let t = 0; tab.innerHTML = "";
        if(d) {
            Object.keys(d).reverse().forEach(key => {
                const x = d[key]; t += x.valor;
                tab.innerHTML += `
                <div class="row animate-up">
                    <div style="flex:1">
                        <span class="badge">${x.data}</span>
                        <div style="font-weight:700; font-size:0.85rem; color:var(--p)">${x.motivo}</div>
                    </div>
                    <div style="font-weight:800; color:${x.valor<0?'var(--g)':'var(--r)'}; margin-right:10px">
                        R$ ${Math.abs(x.valor).toFixed(2)}
                    </div>
                    <button class="btn-del" onclick="deletarItem('${key}')">×</button>
                </div>`;
            });
        }
        document.getElementById('tG').innerText = t.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
    }

    function save(tipo) {
        const m = document.getElementById('mot').value, d = document.getElementById('dia').value, v = parseFloat(document.getElementById('val').value), mes = document.getElementById('mesRef').value;
        if(m && d && v) {
            db.ref(`lojas/${loja}/funcionarios/${idA}/dividas`).push({motivo:m, data:d.padStart(2,'0')+'/'+mes, valor:v, tipo:tipo});
            document.getElementById('mot').value = ""; document.getElementById('val').value = "";
        }
    }

    function pay() {
        const v = parseFloat(document.getElementById('vP').value);
        if(!v) return;
        const h = new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
        db.ref(`lojas/${loja}/funcionarios/${idA}/dividas`).push({motivo:'PAGAMENTO', data:h, valor:-v, tipo:'PGTO'});
        document.getElementById('vP').value = "";
    }

    function deletarItem(k) { if(confirm("Apagar?")) db.ref(`lojas/${loja}/funcionarios/${idA}/dividas/${k}`).remove(); }

    function copyL() {
        const link = `${window.location.origin}${window.location.pathname.replace('admin.html','extrato.html')}?loja=${loja}&id=${idA}`;
        navigator.clipboard.writeText(`Extrato ${nomeA}:\n🔗 ${link}`);
        document.getElementById('toast').style.display = 'block';
        setTimeout(() => document.getElementById('toast').style.display = 'none', 2000);
    }

    loadShortcuts();
    loadF();
</script>
</body>
</html>
