<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Extrato</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0f172a; --a: #fbbf24; --bg: #f8fafc; --g: #10b981; --r: #f43f5e; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; padding: 20px; }
        .box { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); text-align: center; }
        input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 15px; font-size: 1.2rem; text-align: center; margin: 20px 0; outline: none; }
        .btn { background: var(--p); color: var(--a); border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: 800; cursor: pointer; }
        #conteudo { display: none; width: 100%; max-width: 450px; }
        .row { display: flex; justify-content: space-between; padding: 15px; background: white; margin-bottom: 8px; border-radius: 15px; border: 1px solid #f1f5f9; align-items: center; }
        .val { font-weight: 800; }
    </style>
</head>
<body>

    <div id="login" class="box">
        <h2 style="margin:0">Acesso Restrito</h2>
        <p style="color:#64748b; font-size: 0.9rem">Digite seu PIN de 4 dígitos</p>
        <input type="password" id="pinInput" maxlength="4" placeholder="0 0 0 0" inputmode="numeric">
        <button class="btn" onclick="verificar()">ACESSAR EXTRATO</button>
    </div>

    <div id="conteudo">
        <div class="box" style="margin-bottom: 20px;">
            <span id="nomeF" style="text-transform: uppercase; font-weight: 800; color: #94a3b8; font-size: 0.7rem"></span>
            <h1 id="totalG" style="font-size: 2.5rem; margin: 10px 0; letter-spacing: -2px;">R$ 0,00</h1>
        </div>
        <div id="lista"></div>
    </div>

<script>
    const firebaseConfig = { /* USE AS MESMAS CREDENCIAIS DO ADMIN */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const loja = urlParams.get('loja');
    const id = urlParams.get('id');

    function verificar() {
        const input = document.getElementById('pinInput').value;
        db.ref(`lojas/${loja}/funcionarios/${id}`).once('value', s => {
            const f = s.val();
            if(f.pin === input) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('conteudo').style.display = 'block';
                document.getElementById('nomeF').innerText = f.nome;
                carregarDados();
            } else {
                alert("PIN incorreto!");
            }
        });
    }

    function carregarDados() {
        db.ref(`lojas/${loja}/funcionarios/${id}/dividas`).on('value', s => {
            const lista = document.getElementById('lista');
            let total = 0;
            lista.innerHTML = "";
            
            if(s.exists()) {
                const dados = s.val();
                Object.keys(dados).reverse().forEach(k => {
                    const x = dados[k];
                    total += x.valor;
                    lista.innerHTML += `
                        <div class="row">
                            <div>
                                <small style="color:#94a3b8; font-weight:800; font-size:0.6rem">${x.data}</small>
                                <div style="font-weight:600; font-size:0.85rem">${x.motivo}</div>
                            </div>
                            <div class="val" style="color:${x.valor < 0 ? 'var(--g)' : 'var(--r)'}">
                                R$ ${Math.abs(x.valor).toFixed(2)}
                            </div>
                        </div>`;
                });
            }
            document.getElementById('totalG').innerText = total.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
        });
    }
</script>
</body>
</html>
