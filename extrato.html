<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Extrato - MEGA</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0f172a; --a: #fbbf24; --bg: #f8fafc; --g: #10b981; --r: #f43f5e; --b: #2563eb; }
        * { box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .box-login { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); text-align: center; margin-top: 50px; }
        input { width: 100%; padding: 18px; border: 2px solid #f1f5f9; border-radius: 20px; font-size: 1.5rem; text-align: center; margin: 20px 0; outline: none; background: #f8fafc; letter-spacing: 5px; font-weight: 800; }
        .btn { background: var(--p); color: var(--a); border: none; padding: 18px; width: 100%; border-radius: 20px; font-weight: 800; cursor: pointer; }
        #conteudo { display: none; width: 100%; max-width: 450px; }
        .header { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); text-align: center; margin-bottom: 20px; border-bottom: 5px solid var(--a); }
        .nome-pessoa { font-size: 1.2rem; font-weight: 800; color: var(--p); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .label-extrato { color: #94a3b8; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .saldo-atual { font-size: 3.2rem; margin: 10px 0; letter-spacing: -2px; font-weight: 800; }
        .row { display: flex; justify-content: space-between; padding: 18px; background: white; margin-bottom: 12px; border-radius: 22px; border: 1px solid #f1f5f9; align-items: center; }
        .row-vale { border-left: 6px solid var(--b); background: #f0f7ff; }
        .row-pgto { border-left: 6px solid var(--g); background: #f0fdf4; }
        .data-item { color: #64748b; font-weight: 700; font-size: 0.85rem; display: block; }
        .desc-item { font-weight: 700; font-size: 1rem; color: var(--p); }
        .val-item { font-weight: 800; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="login" class="box-login">
        <h2 style="margin:0; font-weight: 800;">Acesso Seguro</h2>
        <p style="color:#64748b; font-size: 0.9rem">Informe seu PIN</p>
        <input type="password" id="pinInput" maxlength="4" placeholder="0000" inputmode="numeric">
        <button class="btn" onclick="verificar()">VER MEU EXTRATO</button>
    </div>

    <div id="conteudo">
        <div class="header">
            <span class="label-extrato">Funcionário(a)</span>
            <span id="nomeF" class="nome-pessoa">...</span>
            <div style="width: 40px; height: 2px; background: var(--a); margin: 15px auto;"></div>
            <h1 id="totalG" class="saldo-atual">R$ 0,00</h1>
        </div>
        <div id="lista"></div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDo_13oIV7Jy5pmsbKBNxtGBIjb_H2Yo-s",
        authDomain: "teste-divida.firebaseapp.com",
        databaseURL: "https://teste-divida-default-rtdb.firebaseio.com",
        projectId: "teste-divida",
        storageBucket: "teste-divida.firebasestorage.app",
        messagingSenderId: "72737446721",
        appId: "1:72737446721:web:9f179ee0812dc110bf5fc0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const loja = urlParams.get('loja');
    const id = urlParams.get('id');

    function verificar() {
        const pin = document.getElementById('pinInput').value;
        db.ref(`lojas/${loja}/funcionarios/${id}`).once('value', s => {
            if(s.val() && s.val().pin === pin) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('conteudo').style.display = 'block';
                document.getElementById('nomeF').innerText = s.val().nome;
                carregar();
            } else { alert("PIN Incorreto!"); }
        });
    }

    function carregar() {
        db.ref(`lojas/${loja}/funcionarios/${id}/dividas`).on('value', s => {
            const lista = document.getElementById('lista');
            let total = 0; lista.innerHTML = "";
            if(s.exists()) {
                const dados = s.val();
                Object.keys(dados).reverse().forEach(k => {
                    const x = dados[k]; total += x.valor;
                    let rc = x.tipo === 'VALE' ? 'row-vale' : (x.valor < 0 ? 'row-pgto' : '');
                    lista.innerHTML += `<div class="row ${rc}"><div><span class="data-item">${x.data}</span><div class="desc-item">${x.motivo}</div></div><div class="val-item" style="color:${x.valor<0?'var(--g)':'var(--r)'}">R$ ${Math.abs(x.valor).toFixed(2)}</div></div>`;
                });
            }
            document.getElementById('totalG').innerText = total.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
        });
    }
</script>
</body>
</html>
