<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEGA ADM ELITE</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0f172a; --a: #fbbf24; --r: #f43f5e; --g: #10b981; --b: #2563eb; --bg: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--p); padding-bottom: 50px; }
        .stores { display: flex; background: var(--p); padding: 12px; gap: 10px; position: sticky; top: 0; z-index: 100; }
        .s-btn { flex: 1; border: none; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 0.7rem; cursor: pointer; background: #1e293b; color: #64748b; text-transform: uppercase; }
        .s-btn.active { background: var(--a); color: var(--p); }
        .drawer { background: #1e293b; padding: 20px; border-bottom: 4px solid var(--a); }
        .f-list { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .f-chip { background: #334155; color: #f8fafc; padding: 12px 22px; border-radius: 50px; white-space: nowrap; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
        .f-chip.active { background: #fff; color: var(--p); border-color: var(--a); }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .dash-row { display: flex; gap: 12px; margin-bottom: 20px; }
        .dash-item { flex: 1; padding: 16px; border-radius: 24px; text-align: center; color: white; }
        .mes-antigo { background: #475569; opacity: 0.8; }
        .mes-atual { background: var(--p); border-bottom: 4px solid var(--a); }
        .dash-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; opacity: 0.7; display: block; }
        .dash-val { font-size: 1rem; font-weight: 800; }
        .soma-box { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .soma-btn { border: 1px solid #e2e8f0; background: #fff; padding: 8px 12px; border-radius: 12px; font-size: 0.65rem; font-weight: 800; color: #64748b; cursor: pointer; }
        .soma-btn.active { border-color: var(--a); background: var(--p); color: #fff; }
        .card { background: #fff; border-radius: 30px; padding: 20px; margin-bottom: 20px; border: 1px solid #f1f5f9; }
        input, select { width: 100%; padding: 16px; margin: 6px 0; border: 2px solid #f1f5f9; border-radius: 18px; font-size: 1rem; background: #f8fafc; }
        .shortcuts-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .tag-btn { background: #f1f5f9; color: #475569; border: none; padding: 10px 18px; border-radius: 14px; font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .btn { border: none; border-radius: 18px; font-weight: 800; cursor: pointer; padding: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .b-dark { background: var(--p); color: #fff; }
        .b-pay { background: var(--g); color: #fff; width: 100%; margin-top: 10px; }
        .row { display: flex; justify-content: space-between; padding: 18px; border-radius: 22px; margin-bottom: 12px; background: #fff; border: 1px solid #f1f5f9; align-items: center; }
        .row-vale { border-left: 6px solid var(--b); background: #eff6ff; }
        .row-pgto { border-left: 6px solid var(--g); background: #f0fdf4; }
        .btn-del { background: #fee2e2; color: var(--r); border: none; width: 36px; height: 36px; border-radius: 12px; font-weight: 800; }
        
        /* Estilo do novo botão de remover funcionário */
        .btn-remover-f { background: none; border: 1px solid #fee2e2; color: var(--r); padding: 5px 10px; border-radius: 10px; font-size: 0.6rem; font-weight: 800; cursor: pointer; margin-left: 10px; vertical-align: middle; }
        .btn-remover-f:hover { background: #fee2e2; }
    </style>
</head>
<body>

<div class="stores">
    <button id="m1" class="s-btn active" onclick="setLoja('Mega Mix', 'm1')">MEGA MIX</button>
    <button id="m2" class="s-btn" onclick="setLoja('Mega Show', 'm2')">MEGA SHOW</button>
</div>

<div class="drawer">
    <div style="display:flex; gap:12px; margin-bottom:12px">
        <input type="text" id="nF" placeholder="Novo funcionário..." style="margin:0">
        <button class="btn b-dark" onclick="addF()" style="width:60px; border-radius: 15px">＋</button>
    </div>
    <div id="fList" class="f-list"></div>
</div>

<div class="container" id="main" style="display:none">
    <div style="text-align:center; padding: 20px 0;">
        <div style="display: flex; align-items: center; justify-content: center;">
            <div id="curName" style="font-weight:800; color:#94a3b8; text-transform: uppercase; font-size: 0.75rem"></div>
            <button class="btn-remover-f" onclick="removeF()">APAGAR PERFIL</button>
        </div>
        
        <div style="font-size: 3.5rem; font-weight: 800; letter-spacing: -3px; margin: 5px 0" id="tG">R$ 0,00</div>
        
        <div class="soma-box">
            <button class="soma-btn active" id="btnG" onclick="filtrarSoma('geral', this)">SOMA TOTAL</button>
            <button class="soma-btn" id="btnC" onclick="filtrarSoma('compra', this)">COMPRAS (ABATIDO)</button>
            <button class="soma-btn" id="btnV" onclick="filtrarSoma('vale', this)">SOMA VALES</button>
        </div>

        <div style="background:#fff; border: 1px solid #e2e8f0; display:inline-block; padding: 10px 20px; border-radius: 16px;">
            <span style="font-size: 0.65rem; font-weight: 800; color: #94a3b8;">PIN: <span id="txtPin" style="color:var(--p)">----</span></span>
        </div>
        <br>
        <button onclick="copyL()" style="background:var(--g); border:none; color:#fff; font-weight:800; font-size:0.75rem; padding: 14px 28px; border-radius: 50px; cursor:pointer; margin-top:15px">
            🟢 ENVIAR PARA O WHATSAPP
        </button>
    </div>

    <div class="dash-row" id="mesesGrid"></div>

    <div class="card">
        <div style="display: flex; gap: 10px;">
            <input type="number" id="dia" placeholder="Dia" inputmode="numeric">
            <select id="mesRef">
                <option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option>
                <option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option>
                <option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option>
                <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
        </div>
        <div class="shortcuts-container" id="shortcutBox"></div>
        <input type="text" id="mot" placeholder="Descrição (Compras)">
        <input type="number" id="val" placeholder="Valor R$" inputmode="decimal">
        
        <div style="display:flex; gap:12px; margin-top:10px">
            <button class="btn b-dark" style="flex:1" onclick="save('COMPRA')">🛒 COMPRA</button>
            <button class="btn" style="flex:1; background:var(--b); color:#fff" onclick="save('VALE')">💵 VALE</button>
        </div>
        <button class="btn b-pay" onclick="pay()">REGISTRAR PAGAMENTO ✅</button>
    </div>

    <div id="tab"></div>
</div>

<script>
    const LINK_GITHUB = window.location.href.split('admin.html')[0];

    const firebaseConfig = {
        apiKey: "AIzaSyDo_13oIV7Jy5pmsbKBNxtGBIjb_H2Yo-s",
        authDomain: "teste-divida.firebaseapp.com",
        databaseURL: "https://teste-divida-default-rtdb.firebaseio.com",
        projectId: "teste-divida",
        storageBucket: "teste-divida.firebasestorage.app",
        messagingSenderId: "72737446721",
        appId: "1:72737446721:web:9f179ee0812dc110bf5fc0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let loja = "Mega Mix", idA = null, nomeA = "", pinA = "", currentFilter = 'geral';
    let sG = 0, sC = 0, sV = 0;
    let shortcuts = JSON.parse(localStorage.getItem('myShortcuts')) || ["Suco", "Doce", "Refri", "Marmita"];
    const mesesNomes = { "01":"Jan","02":"Fev","03":"Mar","04":"Abr","05":"Mai","06":"Jun","07":"Jul","08":"Ago","09":"Set","10":"Out","11":"Nov","12":"Dez" };

    function setLoja(l, b) {
        loja = l; idA = null;
        document.querySelectorAll('.s-btn').forEach(x => x.classList.remove('active'));
        document.getElementById(b).classList.add('active');
        document.getElementById('main').style.display = 'none';
        loadF();
    }

    function loadF() {
        db.ref(`lojas/${loja}/funcionarios`).on('value', s => {
            const list = document.getElementById('fList');
            list.innerHTML = "";
            s.forEach(f => {
                const active = idA === f.key ? 'active' : '';
                list.innerHTML += `<div class="f-chip ${active}" onclick="sel('${f.key}', '${f.val().nome}', '${f.val().pin || "----"}')">${f.val().nome}</div>`;
            });
        });
    }

    // NOVA FUNÇÃO DE REMOVER
    function removeF() {
        if(!idA) return;
        if(confirm(`⚠ PERIGO: Deseja apagar permanentemente o funcionário ${nomeA}? Todos os registros de dívidas dele serão excluídos do banco de dados.`)) {
            db.ref(`lojas/${loja}/funcionarios/${idA}`).remove();
            document.getElementById('main').style.display = 'none';
            idA = null;
            loadF();
        }
    }

    function sel(id, n, pin) {
        idA = id; nomeA = n; pinA = pin;
        document.getElementById('main').style.display = 'block';
        document.getElementById('curName').innerText = n;
        document.getElementById('txtPin').innerText = pin;
        const h = new Date();
        document.getElementById('dia').value = String(h.getDate()).padStart(2,'0');
        document.getElementById('mesRef').value = String(h.getMonth()+1).padStart(2,'0');
        db.ref(`lojas/${loja}/funcionarios/${id}/dividas`).on('value', s => render(s.val()));
        loadF();
    }

    function render(d) {
        const tab = document.getElementById('tab');
        const grid = document.getElementById('mesesGrid');
        sG = 0; sC = 0; sV = 0; let sP = 0; let gastosMes = {};
        tab.innerHTML = "";
        if(d) {
            const itens = Object.keys(d).map(k => ({...d[k], key: k}));
            itens.forEach(x => { 
                if(x.tipo === 'COMPRA') sC += x.valor;
                if(x.tipo === 'VALE') sV += x.valor;
                if(x.valor < 0) sP += x.valor; 
                const mes = x.data.split('/')[1]; 
                gastosMes[mes] = (gastosMes[mes] || 0) + x.valor; 
            });
            itens.reverse().forEach(x => {
                let rowClass = x.tipo === 'VALE' ? "row-vale" : (x.valor < 0 ? "row-pgto" : "");
                tab.innerHTML += `<div class="row ${rowClass}"><div style="flex:1"><span style="font-size:0.6rem;font-weight:800;color:#94a3b8">${x.data}</span><div style="font-weight:700;font-size:0.9rem">${x.motivo}</div></div><div style="font-weight:800;color:${x.valor<0?'var(--g)':'var(--r)'}">R$ ${Math.abs(x.valor).toFixed(2)}</div><button class="btn-del" style="margin-left:15px" onclick="deletarItem('${x.key}')">×</button></div>`;
            });
        }
        sG = sC + sV + sP; sC = sC + sP;
        filtrarSoma(currentFilter, document.getElementById(currentFilter === 'geral' ? 'btnG' : (currentFilter === 'compra' ? 'btnC' : 'btnV')));
        
        grid.innerHTML = "";
        const mesesOrd = Object.keys(gastosMes).sort();
        const ultimos = mesesOrd.slice(-2);
        ultimos.forEach((m, idx) => {
            const estilo = (idx === 0 && ultimos.length > 1) ? 'mes-antigo' : 'mes-atual';
            grid.innerHTML += `<div class="dash-item ${estilo}"><span class="dash-label">${mesesNomes[m] || m}</span><div class="dash-val">R$ ${gastosMes[m].toFixed(2)}</div></div>`;
        });
    }

    function pay() {
        const v = parseFloat(document.getElementById('val').value), d = document.getElementById('dia').value, mes = document.getElementById('mesRef').value;
        if(!v) return;
        const mAbate = prompt("Abatendo qual mês?", mes);
        if(mAbate) {
            db.ref(`lojas/${loja}/funcionarios/${idA}/dividas`).push({motivo:`ABATIMENTO MÊS ${mAbate}`, data:d.padStart(2,'0')+'/'+mes, valor:-v, tipo:'PGTO'});
            document.getElementById('val').value = "";
        }
    }

    function filtrarSoma(tipo, btn) {
        currentFilter = tipo;
        document.querySelectorAll('.soma-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        let v = (tipo === 'geral') ? sG : (tipo === 'compra' ? sC : sV);
        document.getElementById('tG').innerText = v.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
    }

    function save(t) {
        let m = document.getElementById('mot').value;
        const d = document.getElementById('dia').value, v = parseFloat(document.getElementById('val').value), mes = document.getElementById('mesRef').value;
        if(t === 'VALE') m = "VALE";
        if(m && d && v) {
            db.ref(`lojas/${loja}/funcionarios/${idA}/dividas`).push({motivo:m, data:d.padStart(2,'0')+'/'+mes, valor:v, tipo:t});
            document.getElementById('mot').value = ""; document.getElementById('val').value = "";
        }
    }

    function copyL() {
        const link = `${LINK_GITHUB}extrato.html?loja=${encodeURIComponent(loja)}&id=${idA}`;
        const msg = encodeURIComponent(`Olá ${nomeA}! Extrato atualizado:\n🔗 ${link}\n\nPIN: *${pinA}*`);
        window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    function addF() {
        const n = document.getElementById('nF').value, pin = Math.floor(1000 + Math.random() * 9000).toString();
        if(n) db.ref(`lojas/${loja}/funcionarios`).push({ nome: n, pin: pin });
        document.getElementById('nF').value = "";
    }
    function deletarItem(k) { if(confirm("Apagar?")) db.ref(`lojas/${loja}/funcionarios/${idA}/dividas/${k}`).remove(); }
    function loadShortcuts() {
        const box = document.getElementById('shortcutBox');
        box.innerHTML = shortcuts.map(s => `<button class="tag-btn" onclick="document.getElementById('mot').value='${s}'">${s}</button>`).join('') + `<button class="tag-btn" style="background:var(--p);color:var(--a)" onclick="addShortcut()">＋</button>`;
    }
    function addShortcut() {
        const n = prompt("Novo atalho:");
        if(n) { shortcuts.push(n); localStorage.setItem('myShortcuts', JSON.stringify(shortcuts)); loadShortcuts(); }
    }
    loadShortcuts(); loadF();
</script>
</body>
</html>
